name: Apps

# The iOS and Android apps (v0.43.0), built from the same code as the website (capacitor.config.ts).
# Every run checks that both build: an Android app to install (debug APK) and an iOS build for the simulator.
# Started by hand with "upload", it also sends them to the testers: Android to Play's internal test (or, with track
# alpha, the closed test; production, everyone, v0.54.2) and iOS to TestFlight. Android's release is a draft to roll out in Play Console, or with
# release "rollout" (v0.50.2) it goes out to that track's testers straight away. That needs these repository secrets (Settings → Secrets and variables → Actions):
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#            PLAY_SERVICE_ACCOUNT_JSON
#   iOS:     APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key, "App Manager" role)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Send the builds to TestFlight and Play's internal test
        type: boolean
        default: false
      track:
        description: "Play's track: internal (internal test), alpha (closed test: the 12 testers for 14 days, v0.48.0) or production (everyone, once Play has given production access)"
        type: choice
        options: [internal, alpha, production]
        default: internal
      release:
        description: "Play's release: draft (you roll it out in Play Console) or rollout (out to the track's testers now)"
        type: choice
        options: [draft, rollout]
        default: draft
  pull_request:
    paths: [android/**, ios/**, src/native/**, capacitor.config.ts, package.json, package-lock.json, resources/**, .github/workflows/apps.yml]
  push:
    branches: [main]

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

# bash with pipefail: a build that fails fails the step, even when its output is cut short with tail.
defaults:
  run:
    shell: bash

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      APP_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Upload key (from the secrets, when there is one)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
      - name: Play's internal test
        if: ${{ inputs.upload && env.ANDROID_KEYSTORE_PATH != '' }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.divaor.globe
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.release == 'rollout' && 'completed' || 'draft' }}

  ios:
    runs-on: macos-15
    env:
      # TestFlight needs the App Store Connect key; until it is a secret, "upload" still builds for the simulator, so an
      # Android upload does not leave a red iOS job (v0.48.0).
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the simulator (no signing)
        if: ${{ !inputs.upload || env.HAS_ASC != 'true' }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
      - name: Archive and send to TestFlight
        if: ${{ inputs.upload && env.HAS_ASC == 'true' }}
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            $AUTH archive | tail -n 40
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH | tail -n 40
